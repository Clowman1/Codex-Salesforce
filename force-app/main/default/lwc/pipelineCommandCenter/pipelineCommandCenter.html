<template>
    <section class={rootClass}>
        <template if:true={showCeoHubHomeOverride}>
            <c-ceo-intelligence-center page-key="hub"></c-ceo-intelligence-center>
        </template>

        <template if:false={showCeoHubHomeOverride}>
        <header class="pcc-hero">
            <p class="pcc-licensed-states">Licensed in: FL, CA, CO, GA, LA, MD, NJ, NC, PA, SC, TN, VA, TX</p>
            <div>
                <p class="pcc-kicker">Reach Home Loans</p>
                <h1>{headerTitle}</h1>
                <p class="pcc-subtitle">{headerSubtitle}</p>
            </div>
            <template if:true={showHeroActions}>
                <div class="pcc-hero-actions">
                <template if:true={showCreateLeadButton}>
                    <button class="pcc-button pcc-button-primary" onclick={openNewLeadFlow} type="button">Create a New Lead</button>
                </template>
                <button class="pcc-button pcc-button-primary" onclick={openNewRealtorPartner} type="button">{realtorAccountButtonLabel}</button>
                <template if:true={showRealtorLeadButton}>
                    <button class="pcc-button pcc-button-primary" onclick={openNewRealtorLead} type="button">Create New Realtor Lead</button>
                </template>
                <template if:true={showQuickButtons}>
                    <template for:each={quickButtons} for:item="button">
                        <button key={button.key} class={button.className} data-object={button.objectApiName} data-filter={button.filterName} onclick={openListView}>{button.label}</button>
                    </template>
                </template>
                <template if:true={showEditButtons}>
                    <button class="pcc-button pcc-button-ghost" onclick={openEditor}>Edit Buttons</button>
                </template>
                </div>
            </template>
        </header>

        <template if:true={isLoading}>
            <div class="pcc-loading">
                <lightning-spinner alternative-text="Loading pipeline command center" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={error}>
            <div class="pcc-error">{error}</div>
        </template>

        <template if:false={isLoading}>
            <div class="pcc-card-grid">
                <template for:each={statusCards} for:item="card">
                    <button key={card.key} class={card.className} data-object={card.objectApiName} data-filter={card.filterName} onclick={openListView} type="button">
                        <span class="pcc-stat-label">{card.label}</span>
                        <strong>{card.valueText}</strong>
                        <span class="pcc-stat-helper">{card.helperText}</span>
                    </button>
                </template>
            </div>

            <section class="pcc-layout">
                <article class="pcc-panel pcc-panel-large">
                    <div class="pcc-panel-header">
                        <div>
                            <h2>{activePipelineTitle}</h2>
                            <p>{activePipelineSubtitle}</p>
                        </div>
                        <template if:true={showPanelOpenButton}>
                            <button class="pcc-icon-button" data-object="Transaction__c" data-filter="Copy_of_Open_Pipeline_Processor" onclick={openListView} title="Open Processor Review Pipeline">
                                <lightning-icon icon-name="utility:new_window" size="x-small"></lightning-icon>
                            </button>
                        </template>
                    </div>
                    <template if:true={showBenMasterGroups}>
                        <div class="pcc-ben-master-tabs" role="tablist" aria-label="Ben work groups">
                            <template for:each={benMasterGroups} for:item="group">
                                <button
                                    key={group.key}
                                    class={group.className}
                                    data-key={group.key}
                                    onclick={selectBenMasterGroup}
                                    type="button">
                                    <span>{group.label}</span>
                                    <strong>{group.count}</strong>
                                </button>
                            </template>
                        </div>
                    </template>
                    <template if:true={showJoeyMasterGroups}>
                        <div class="pcc-ben-master-tabs pcc-joey-master-tabs" role="tablist" aria-label="Loan officer work groups">
                            <template for:each={joeyMasterGroups} for:item="group">
                                <button
                                    key={group.key}
                                    class={group.className}
                                    data-key={group.key}
                                    onclick={selectJoeyMasterGroup}
                                    type="button">
                                    <span>{group.label}</span>
                                    <strong>{group.count}</strong>
                                </button>
                            </template>
                        </div>
                    </template>
                    <template if:true={showPipelineTabRows}>
                        <div class="pcc-tabs" role="tablist" aria-label="Pipeline sections">
                            <template for:each={pipelineTabRows} for:item="tabRow">
                                <div key={tabRow.key} class="pcc-tab-row">
                                    <template for:each={tabRow.tabs} for:item="tab">
                                        <button
                                            key={tab.key}
                                            class={tab.className}
                                            data-key={tab.key}
                                            draggable="true"
                                            ondragstart={handleTabDragStart}
                                            ondragover={handleTabDragOver}
                                            ondrop={handleTabDrop}
                                            ondragend={handleTabDragEnd}
                                            onclick={selectPipelineTab}
                                            type="button">
                                            <span>{tab.label}</span>
                                            <strong>{tab.count}</strong>
                                        </button>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                    <div class="pcc-table-wrap">
                        <template if:true={showBenEmptyGroup}>
                            <div class="pcc-empty pcc-ben-empty-group">{benEmptyGroupMessage}</div>
                        </template>
                        <template if:true={isConversionMetricsTab}>
                            <table class="pcc-table pcc-metric-table">
                                <thead>
                                    <tr>
                                        <th>Loan Officer</th>
                                        <th>New to Pre-Approval</th>
                                        <th>Pre-Approval to Transaction</th>
                                        <th>New to Post-Closed</th>
                                        <th>Avg Active Days - 12 Mo</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={activeMetricRows} for:item="row">
                                        <tr key={row.key}>
                                            <td>{row.loanOfficerName}</td>
                                            <td>
                                                <button class="pcc-mini-metric" data-report-url={row.newToPreApprovalReportUrl} onclick={openReport} type="button">
                                                    <strong>{row.formattedNewToPreApprovalPercent}</strong>
                                                    <span>YTD</span>
                                                </button>
                                            </td>
                                            <td>
                                                <button class="pcc-mini-metric" data-report-url={row.preApprovalToTransactionReportUrl} onclick={openReport} type="button">
                                                    <strong>{row.formattedPreApprovalToTransactionPercent}</strong>
                                                    <span>YTD</span>
                                                </button>
                                            </td>
                                            <td>
                                                <button class="pcc-mini-metric" data-report-url={row.newToPostClosedReportUrl} onclick={openReport} type="button">
                                                    <strong>{row.formattedNewToPostClosedPercent}</strong>
                                                    <span>YTD</span>
                                                </button>
                                            </td>
                                            <td>
                                                <button class="pcc-mini-metric pcc-mini-metric-neutral" data-report-url={row.averageActiveDaysReportUrl} onclick={openReport} type="button">
                                                    <strong>{row.formattedAverageActiveDays}</strong>
                                                    <span>Days / 12 mo</span>
                                                </button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template if:true={isOpenerWorkflowTab}>
                            <table class="pcc-table">
                                <thead>
                                    <tr>
                                        <th>
                                            <button class={nameSortClass} data-field="name" onclick={handleSort} type="button">
                                                <span>Name</span>
                                                <span class="pcc-sort-indicator">{nameSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button class={statusSortClass} data-field="status" onclick={handleSort} type="button">
                                                <span>Status</span>
                                                <span class="pcc-sort-indicator">{statusSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button class={tridSortClass} data-field={openerDateSortField} onclick={handleSort} type="button">
                                                <span>{openerDateColumnLabel}</span>
                                                <span class="pcc-sort-indicator">{tridSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button class={lenderSortClass} data-field="lenderName" onclick={handleSort} type="button">
                                                <span>Lender</span>
                                                <span class="pcc-sort-indicator">{lenderSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button class={purposeSortClass} data-field="loanPurpose" onclick={handleSort} type="button">
                                                <span>Purpose</span>
                                                <span class="pcc-sort-indicator">{purposeSortIndicator}</span>
                                            </button>
                                        </th>
                                        <template if:true={showsOwnerColumn}>
                                            <th>
                                                <button class={ownerSortClass} data-field="ownerName" onclick={handleSort} type="button">
                                                    <span>Owner</span>
                                                    <span class="pcc-sort-indicator">{ownerSortIndicator}</span>
                                                </button>
                                            </th>
                                        </template>
                                        <th>
                                            <button class={loanOfficerSortClass} data-field="loanOfficerName" onclick={handleSort} type="button">
                                                <span>Loan Officer</span>
                                                <span class="pcc-sort-indicator">{loanOfficerSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button class={detailSortClass} data-field="detail" onclick={handleSort} type="button">
                                                <span>Open Checklist Items</span>
                                                <span class="pcc-sort-indicator">{detailSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>EASE Link</th>
                                        <template if:true={isActionablePipelineTab}>
                                            <th class="pcc-action-column">Actions</th>
                                        </template>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={activePipelineRows} for:item="row">
                                        <tr key={row.key}>
                                            <td><a href="#" data-record-id={row.id} onclick={openRecord}>{row.name}</a></td>
                                            <td><span class={row.statusClass}>{row.statusLabel}</span></td>
                                            <td>{row.formattedOpenerDate}</td>
                                            <td>{row.lenderName}</td>
                                            <td>{row.loanPurpose}</td>
                                            <template if:true={showsOwnerColumn}>
                                                <td>{row.ownerName}</td>
                                            </template>
                                            <td>{row.loanOfficerName}</td>
                                            <td>
                                                <div class="pcc-note-preview" title={row.detail}>
                                                    <span>{row.detail}</span>
                                                    <template if:true={row.hasDetail}>
                                                        <button class="pcc-inline-view" data-title="Open Checklist Items" data-text={row.detail} onclick={openTextPreview} type="button">View</button>
                                                    </template>
                                                </div>
                                            </td>
                                            <td>
                                                <template if:true={row.hasEaseLink}>
                                                    <a href={row.easeLink} target="_blank" rel="noopener noreferrer">EASE</a>
                                                </template>
                                            </td>
                                            <template if:true={isTransactionPipelineTab}>
                                                <td class="pcc-action-column">
                                                    <div class="pcc-row-actions">
                                                        <template if:true={isBrokerChecksOutstandingTab}>
                                                            <button class="pcc-row-edit pcc-row-success" data-record-id={row.id} onclick={openBrokerCheckConfirm} type="button">Check Received</button>
                                                        </template>
                                                        <button class="pcc-row-edit" data-record-id={row.id} onclick={openEventEditor} type="button">Set Event</button>
                                                        <template if:true={isPastClientTab}>
                                                            <button class="pcc-row-edit pcc-row-danger" data-record-id={row.id} onclick={handlePastClientBadPhone} type="button">{pastClientActionLabel}</button>
                                                            <button class="pcc-row-edit pcc-row-brown" data-record-id={row.id} onclick={handlePastClientNoBrownies} type="button">No Brownies</button>
                                                        </template>
                                                        <template if:false={isPastClientTab}>
                                                            <button class="pcc-row-edit" data-record-id={row.id} onclick={openProcessorNoteEditor} type="button">Note</button>
                                                        </template>
                                                    </div>
                                                </td>
                                            </template>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template if:true={isCloserWorkflowTab}>
                            <table class="pcc-table">
                                <thead>
                                    <tr>
                                        <th>
                                            <button class={nameSortClass} data-field="name" onclick={handleSort} type="button">
                                                <span>Name</span>
                                                <span class="pcc-sort-indicator">{nameSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button class={standardPrimaryColumnSortClass} data-field={standardPrimaryColumnSortField} onclick={handleSort} type="button">
                                                <span>{standardPrimaryColumnLabel}</span>
                                                <span class="pcc-sort-indicator">{standardPrimaryColumnSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button class={statusSortClass} data-field="status" onclick={handleSort} type="button">
                                                <span>Status</span>
                                                <span class="pcc-sort-indicator">{statusSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button class={cdSentDateSortClass} data-field="cdSentDate" onclick={handleSort} type="button">
                                                <span>CD Sent Date</span>
                                                <span class="pcc-sort-indicator">{cdSentDateSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button class={closingDateSortClass} data-field="displayDate" onclick={handleSort} type="button">
                                                <span>Closing Date</span>
                                                <span class="pcc-sort-indicator">{closingDateSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button class={fundingDateSortClass} data-field="fundingDate" onclick={handleSort} type="button">
                                                <span>Funding Date</span>
                                                <span class="pcc-sort-indicator">{fundingDateSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button class={lenderSortClass} data-field="lenderName" onclick={handleSort} type="button">
                                                <span>Lender</span>
                                                <span class="pcc-sort-indicator">{lenderSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button class={purposeSortClass} data-field="loanPurpose" onclick={handleSort} type="button">
                                                <span>Purpose</span>
                                                <span class="pcc-sort-indicator">{purposeSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button class={closerNotesSortClass} data-field="closerNotes" onclick={handleSort} type="button">
                                                <span>Closing Notes for Closer</span>
                                                <span class="pcc-sort-indicator">{closerNotesSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button class={detailSortClass} data-field="detail" onclick={handleSort} type="button">
                                                <span>Open Checklist Items</span>
                                                <span class="pcc-sort-indicator">{detailSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>EASE Link</th>
                                        <th class="pcc-action-column">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={activePipelineRows} for:item="row">
                                        <tr key={row.key}>
                                            <td><a href="#" data-record-id={row.id} onclick={openRecord}>{row.name}</a></td>
                                            <td><span class={row.statusClass}>{row.statusLabel}</span></td>
                                            <td>{row.formattedCdSentDate}</td>
                                            <td>{row.formattedDisplayDate}</td>
                                            <td>{row.formattedFundingDate}</td>
                                            <td>{row.lenderName}</td>
                                            <td>{row.loanPurpose}</td>
                                            <td>
                                                <div class="pcc-note-preview" title={row.closerNotes}>
                                                    <span>{row.closerNotes}</span>
                                                    <template if:true={row.hasCloserNotes}>
                                                        <button class="pcc-inline-view" data-title="Closing Notes for Closer" data-text={row.closerNotes} onclick={openTextPreview} type="button">View</button>
                                                    </template>
                                                </div>
                                            </td>
                                            <td>
                                                <div class="pcc-note-preview" title={row.detail}>
                                                    <span>{row.detail}</span>
                                                    <template if:true={row.hasDetail}>
                                                        <button class="pcc-inline-view" data-title="Open Checklist Items" data-text={row.detail} onclick={openTextPreview} type="button">View</button>
                                                    </template>
                                                </div>
                                            </td>
                                            <td>
                                                <template if:true={row.hasEaseLink}>
                                                    <a href={row.easeLink} target="_blank" rel="noopener noreferrer">EASE</a>
                                                </template>
                                            </td>
                                            <td class="pcc-action-column">
                                                <div class="pcc-row-actions">
                                                    <button class="pcc-row-edit" data-record-id={row.id} onclick={openEventEditor} type="button">Set Event</button>
                                                    <template if:true={isPastClientTab}>
                                                        <button class="pcc-row-edit pcc-row-danger" data-record-id={row.id} onclick={handlePastClientBadPhone} type="button">{pastClientActionLabel}</button>
                                                        <button class="pcc-row-edit pcc-row-brown" data-record-id={row.id} onclick={handlePastClientNoBrownies} type="button">No Brownies</button>
                                                    </template>
                                                    <template if:false={isPastClientTab}>
                                                        <button class="pcc-row-edit" data-record-id={row.id} onclick={openProcessorNoteEditor} type="button">Note</button>
                                                    </template>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template if:true={isAppraisalsOutstandingTab}>
                            <table class="pcc-table pcc-feature-table">
                                <thead>
                                    <tr>
                                        <th>File Name</th>
                                        <th>Status</th>
                                        <th>Appraisal Ordered Date</th>
                                        <th>ValueLink Ordered Date</th>
                                        <th>Appraisal Order Status</th>
                                        <th>Due Date</th>
                                        <th>Lender</th>
                                        <th>Loan Officer</th>
                                        <th>Processor</th>
                                        <th>Owner</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={activePipelineRows} for:item="row">
                                        <tr key={row.key}>
                                            <td><a href="#" data-record-id={row.id} onclick={openRecord}>{row.name}</a></td>
                                            <td><span class={row.statusClass}>{row.statusLabel}</span></td>
                                            <td>{row.formattedAppraisalOrderedDate}</td>
                                            <td>{row.formattedValueLinkOrderedDate}</td>
                                            <td><span class="pcc-soft-pill">{row.appraisalStatus}</span></td>
                                            <td>{row.formattedAppraisalDueDate}</td>
                                            <td>{row.lenderName}</td>
                                            <td>{row.loanOfficerName}</td>
                                            <td>{row.processorName}</td>
                                            <td>{row.ownerName}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template if:true={isBrokerChecksOutstandingTab}>
                            <table class="pcc-table">
                                <thead>
                                    <tr>
                                        <th>
                                            <button class={nameSortClass} data-field="name" onclick={handleSort} type="button">
                                                <span>File Name</span>
                                                <span class="pcc-sort-indicator">{nameSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button class={fundingDateSortClass} data-field="fundingDate" onclick={handleSort} type="button">
                                                <span>Funding Date</span>
                                                <span class="pcc-sort-indicator">{fundingDateSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th class="pcc-action-column">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={activePipelineRows} for:item="row">
                                        <tr key={row.key}>
                                            <td><a href="#" data-record-id={row.id} onclick={openRecord}>{row.name}</a></td>
                                            <td>{row.formattedFundingDate}</td>
                                            <td class="pcc-action-column">
                                                <button class="pcc-row-edit pcc-row-success" data-record-id={row.id} onclick={openBrokerCheckConfirm} type="button">Check Received</button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template if:true={isGenericCustomColumnTab}>
                            <table class={customTableClass}>
                                <thead>
                                    <tr>
                                        <template for:each={activeCustomColumns} for:item="column">
                                            <th key={column.key}>
                                                <button class={column.sortClass} data-field={column.sortField} onclick={handleSort} type="button">
                                                    <span>{column.displayLabel}</span>
                                                    <span class="pcc-sort-indicator">{column.sortIndicator}</span>
                                                </button>
                                            </th>
                                        </template>
                                        <template if:true={isActionablePipelineTab}>
                                            <th class="pcc-action-column">Actions</th>
                                        </template>
                                        <template if:true={showPassAction}>
                                            <th class="pcc-pass-column"></th>
                                        </template>
                                        <template if:true={canEditPipelineTabRows}>
                                            <th class="pcc-action-column">Edit</th>
                                        </template>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={activePipelineRows} for:item="row">
                                        <tr key={row.key} class={row.rowClass}>
                                            <template for:each={row.customCells} for:item="cell">
                                                <td key={cell.key} title={cell.value}>
                                                    <template if:true={cell.isRecordLink}>
                                                        <a href="#" data-record-id={row.id} onclick={openRecord}>{cell.value}</a>
                                                    </template>
                                                    <template if:true={cell.isExternalLink}>
                                                        <a href={cell.url} target="_blank" rel="noopener noreferrer">{cell.value}</a>
                                                    </template>
                                                    <template if:false={cell.isRecordLink}>
                                                        <template if:false={cell.isExternalLink}>
                                                            <template if:true={cell.isPhoneLink}>
                                                                <a class="pcc-phone-link" href={cell.phoneHref}>{cell.value}</a>
                                                            </template>
                                                            <template if:false={cell.isPhoneLink}>
                                                                <div class="pcc-note-preview">
                                                                    <span>{cell.value}</span>
                                                                    <template if:true={cell.isPreviewable}>
                                                                        <button class="pcc-inline-view" data-title="Full Cell Value" data-text={cell.value} onclick={openTextPreview} type="button">View</button>
                                                                    </template>
                                                                </div>
                                                            </template>
                                                        </template>
                                                    </template>
                                                </td>
                                            </template>
                                            <template if:true={isActionablePipelineTab}>
                                                <td class="pcc-action-column">
                                                    <div class="pcc-row-actions">
                                                        <template if:false={isManagerNoteTab}>
                                                            <button class="pcc-row-edit" data-record-id={row.id} onclick={openEventEditor} type="button">Set Event</button>
                                                        </template>
                                                        <template if:true={isPastClientTab}>
                                                            <button class="pcc-row-edit pcc-row-danger" data-record-id={row.id} onclick={handlePastClientBadPhone} type="button">{pastClientActionLabel}</button>
                                                            <button class="pcc-row-edit pcc-row-brown" data-record-id={row.id} onclick={handlePastClientNoBrownies} type="button">No Brownies</button>
                                                        </template>
                                                        <template if:false={isPastClientTab}>
                                                            <button class="pcc-row-edit" data-record-id={row.id} onclick={openProcessorNoteEditor} type="button">Note</button>
                                                        </template>
                                                    </div>
                                                </td>
                                            </template>
                                            <template if:true={showPassAction}>
                                                <td class="pcc-pass-column">
                                                    <button class="pcc-pass-pill" data-record-id={row.id} onclick={handlePassFollowUp} title="Treat as contacted and cycle this lead back later" type="button">Pass</button>
                                                </td>
                                            </template>
                                            <template if:true={canEditPipelineTabRows}>
                                                <td class="pcc-action-column">
                                                    <button class="pcc-row-edit" data-record-id={row.id} onclick={openRowEditor} type="button">Edit</button>
                                                </td>
                                            </template>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template if:true={isExecutiveAssignedLeadsTab}>
                            <table class="pcc-table">
                                <thead>
                                    <tr>
                                        <th>
                                            <button class={createdDateTimeSortClass} data-field="createdDateTime" onclick={handleSort} type="button">
                                                <span>Created Date</span>
                                                <span class="pcc-sort-indicator">{createdDateTimeSortIndicator}</span>
                                            </button>
                                        </th>
                                        <th>
                                            <button class={lastActivityDateSortClass} data-field="lastActivityDate" onclick={handleSort} type="button">
                                                <span>Last Activity</span>

                            <lightning-messages></lightning-messages>
                            <div class="pcc-row-editor-grid">
                                <template for:each={rowEditorFields} for:item="field">
                                    <lightning-input-field key={field.key} field-name={field.fieldApiName}></lightning-input-field>
                                </template>
                            </div>
                        </lightning-record-edit-form>
                    </div>
                    <footer class="pcc-modal-footer">
                        <button class="pcc-button" onclick={closeRowEditor} disabled={isRowSaving}>Cancel</button>
                        <button class="pcc-button pcc-button-primary" onclick={submitRowEditor} disabled={isRowSaving}>Save Changes</button>
                    </footer>
                </div>
            </section>
        </template>

        <template if:true={isProcessorNoteEditorOpen}>
            <section class="pcc-modal-backdrop" role="dialog" aria-modal="true" aria-label={processorNoteTitle}>
                <div class="pcc-modal pcc-row-modal">
                    <header class="pcc-modal-header">
                        <div>
                            <h2>{processorNoteTitle}</h2>
                            <p>{noteEditorSubtitle}</p>
                        </div>
                    </header>
                    <div class="pcc-modal-body">
                        <template if:true={processorNoteError}>
                            <div class="pcc-modal-error">{processorNoteError}</div>
                        </template>
                        <lightning-textarea
                            label={noteEditorLabel}
                            value={processorNoteText}
                            onchange={handleProcessorNoteTextChange}
                            required>
                        </lightning-textarea>
                    </div>
                    <footer class="pcc-modal-footer">
                        <button class="pcc-button" onclick={closeProcessorNoteEditor} disabled={isProcessorNoteSaving}>Cancel</button>
                        <button class="pcc-button pcc-button-primary" onclick={saveProcessorNoteFromEditor} disabled={isProcessorNoteSaving}>Save Note</button>
                    </footer>
                </div>
            </section>
        </template>

        <template if:true={isEventEditorOpen}>
            <section class="pcc-modal-backdrop" role="dialog" aria-modal="true" aria-label={eventEditorTitle}>
                <div class="pcc-modal pcc-row-modal">
                    <header class="pcc-modal-header">
                        <div>
                            <h2>{eventEditorTitle}</h2>
                            <p>This creates a 15-minute Scheduled Appointment on the Transaction and your calendar.</p>
                        </div>
                    </header>
                    <div class="pcc-modal-body">
                        <template if:true={eventEditorError}>
                            <div class="pcc-modal-error">{eventEditorError}</div>
                        </template>
                        <div class="pcc-event-editor-grid">
                            <lightning-input
                                label="Event Name"
                                value={eventSubject}
                                onchange={handleEventSubjectChange}
                                required>
                            </lightning-input>
                            <lightning-input
                                type="datetime"
                                label="Event Date/Time"
                                value={eventStartDateTime}
                                onchange={handleEventStartDateTimeChange}
                                required>
                            </lightning-input>
                        </div>
                    </div>
                    <footer class="pcc-modal-footer">
                        <button class="pcc-button" onclick={closeEventEditor} disabled={isEventSaving}>Cancel</button>
                        <button class="pcc-button pcc-button-primary" onclick={saveEventFromEditor} disabled={isEventSaving}>Save Event</button>
                    </footer>
                </div>
            </section>
        </template>

        <template if:true={isBrokerCheckConfirmOpen}>
            <section class="pcc-modal-backdrop" role="dialog" aria-modal="true" aria-label={brokerCheckConfirmTitle}>
                <div class="pcc-modal pcc-row-modal">
                    <header class="pcc-modal-header">
                        <div>
                            <h2>{brokerCheckConfirmTitle}</h2>
                            <p>Check received and scanned?</p>
                        </div>
                    </header>
                    <div class="pcc-modal-body">
                        <template if:true={brokerCheckError}>
                            <div class="pcc-modal-error">{brokerCheckError}</div>
                        </template>
                    </div>
                    <footer class="pcc-modal-footer">
                        <button class="pcc-button" onclick={closeBrokerCheckConfirm} disabled={isBrokerCheckSaving}>Cancel</button>
                        <button class="pcc-button pcc-button-primary" onclick={confirmBrokerCheckReceived} disabled={isBrokerCheckSaving}>Confirm</button>
                    </footer>
                </div>
            </section>
        </template>

        <template if:true={isPastClientConfirmOpen}>
            <section class="pcc-modal-backdrop" role="dialog" aria-modal="true" aria-label={pastClientConfirmTitle}>
                <div class="pcc-modal pcc-row-modal">
                    <header class="pcc-modal-header">
                        <div>
                            <h2>{pastClientConfirmTitle}</h2>
                            <p>{pastClientConfirmMessage}</p>
                        </div>
                    </header>
                    <div class="pcc-modal-body">
                        <template if:true={pastClientConfirmError}>
                            <div class="pcc-modal-error">{pastClientConfirmError}</div>
                        </template>
                    </div>
                    <footer class="pcc-modal-footer">
                        <button class="pcc-button" onclick={closePastClientConfirm} disabled={isPastClientActionSaving}>Cancel</button>
                        <button class="pcc-button pcc-button-primary" onclick={confirmPastClientAction} disabled={isPastClientActionSaving}>{pastClientConfirmButtonLabel}</button>
                    </footer>
                </div>
            </section>
        </template>

        <template if:true={isTextPreviewOpen}>
            <section class="pcc-modal-backdrop" role="dialog" aria-modal="true" aria-label={textPreviewTitle}>
                <div class="pcc-modal pcc-text-preview-modal">
                    <header class="pcc-modal-header">
                        <div>
                            <h2>{textPreviewTitle}</h2>
                            <p>Full text from the selected Home Screen row.</p>
                        </div>
                    </header>
                    <div class="pcc-modal-body">
                        <div class="pcc-text-preview-body">{textPreviewBody}</div>
                    </div>
                    <footer class="pcc-modal-footer">
                        <button class="pcc-button pcc-button-primary" onclick={closeTextPreview}>Close</button>
                    </footer>
                </div>
            </section>
        </template>
        </template>
    </section>
</template>
