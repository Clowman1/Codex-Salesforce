<template>
    <div class="pru-root">
        <!-- Header -->
        <header class="pru-header">
            <div class="pru-header-inner">
                <div class="pru-header-left">
                    <h1 class="pru-title">Conditions Review</h1>
                    <p class="pru-subtitle">Triage and review open items across your pipeline.</p>
                </div>
                <div class="pru-stats">
                    <div class="pru-stat">
                        <span class="pru-stat-iconwrap pru-stat-iconwrap-amber">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fcba03" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-alert w-4 h-4 text-amber-500 mr-2" aria-hidden="true" data-id="element-250"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
                        </span>
                        <span class="pru-stat-value">{totalConditions}</span>
                        <span class="pru-stat-label">Conditions</span>
                    </div>
                    <div class="pru-stat pru-stat-divider">
                        <span class="pru-stat-iconwrap pru-stat-iconwrap-blue">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b83f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text w-4 h-4 text-blue-500 mr-2" aria-hidden="true" data-id="element-254"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg>
                        </span>
                        <span class="pru-stat-value">{totalDocs}</span> 
                        <span class="pru-stat-label">Docs</span>
                    </div>
                    <div class="pru-stat">
                        <span class="pru-stat-iconwrap pru-stat-iconwrap-purple">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-message-square w-4 h-4 text-purple-500 mr-2" aria-hidden="true" data-id="element-258"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        </span>
                        <span class="pru-stat-value">{totalComments}</span>
                        <span class="pru-stat-label">Comments</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="pru-main">
            <template if:true={isLoading}>
                <div class="pru-loading">
                    <lightning-spinner alternative-text="Loading review queue" size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:true={error}>
                <div class="pru-error">{error}</div>
            </template>

            <template if:true={hasLoans}>
                <template for:each={loans} for:item="loan">
                    <div key={loan.loanId} class="pru-loan-card">
                        <div class="pru-loan-header" data-loan-id={loan.loanId} onclick={handleToggleLoan}>
                            <div class="pru-loan-header-left">
                                <div class="pru-loan-title-row">
                                    <h3 class="pru-loan-borrower">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0b5cab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user w-5 h-5 mr-2 text-[#0b5cab]" aria-hidden="true" data-id="element-212"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                        <span>{loan.borrowerName}</span>
                                    </h3>
                                    <template if:true={loan.stage}>
                                        <span class="pru-stage-chip">{loan.stage}</span>
                                    </template>
                                    <a class="pru-open-loan" href="#" data-loan-id={loan.loanId}
                                       onclick={handleOpenLoan}>
                                       <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0b5cab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-external-link w-3.5 h-3.5 mr-1" aria-hidden="true" data-id="element-215"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>
                                        <span>Open Loan</span>
                                    </a>
                                </div>
                                <div class="pru-loan-meta">
                                    <span class="pru-meta-item">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-hash w-4 h-4 mr-1.5 text-slate-400" aria-hidden="true" data-id="element-218"><line x1="4" x2="20" y1="9" y2="9"></line><line x1="4" x2="20" y1="15" y2="15"></line><line x1="10" x2="8" y1="3" y2="21"></line><line x1="16" x2="14" y1="3" y2="21"></line></svg>
                                        {loan.loanNumber}
                                    </span>
                                    <span class="pru-meta-item pru-meta-amount">{loan.formattedAmount}</span>
                                    <template if:true={loan.propertyAddress}>
                                        <span class="pru-meta-item">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-building2 lucide-building-2 w-4 h-4 mr-1.5 text-slate-400" aria-hidden="true" data-id="element-221"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path><path d="M10 6h4"></path><path d="M10 10h4"></path><path d="M10 14h4"></path><path d="M10 18h4"></path></svg>
                                            {loan.propertyAddress}
                                        </span>
                                    </template>
                                </div>
                            </div>
                            <div class="pru-loan-header-right">
                                <template if:true={loan.unreadCommentsCount}>
                                    <span class="pru-pill pru-pill-alert">
                                        <span class="pru-stat-iconwrap pru-stat-iconwrap-purple">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-message-square w-4 h-4 text-red-700 mr-2" aria-hidden="true" data-id="element-258"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                                        </span>
                                        {loan.unreadCommentsCount}&nbsp;Unread
                                    </span>
                                </template>
                                <span class="pru-pill pru-pill-alert">
                                    <span class="pru-stat-iconwrap pru-stat-iconwrap-amber">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-alert w-4 h-4 text-red-700 mr-2" aria-hidden="true" data-id="element-250"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
                                    </span>
                                    {loan.pendingLabel}
                                </span>
                                <lightning-icon icon-name={loan.chevronIcon} size="small" class="pru-chevron"></lightning-icon>
                            </div>
                        </div>

                        <template if:true={loan.isExpanded}>
                            <div class="pru-loan-body">
                                <template for:each={loan.conditions} for:item="cond">
                                    <div key={cond.id} class="pru-condition-row">
                                        <div class="pru-condition-row-main">
                                            <div class="pru-condition-title-row">
                                                <h4 class="pru-condition-title">{cond.title}</h4>
                                                <span class={cond.statusBadgeClass}>
                                                    <template if:true={cond.isReviewIcon}>
                                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye w-3.5 h-3.5 mr-1" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                                    </template>
                                                    <template if:false={cond.isReviewIcon}>
                                                        <lightning-icon icon-name={cond.statusBadgeIcon} size="xx-small"></lightning-icon>
                                                    </template>
                                                    {cond.status}
                                                </span>
                                            </div>
                                            <div class="pru-condition-meta">
                                                <template if:true={cond.category}>
                                                    <span class="pru-meta-item">
                                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-tag w-3.5 h-3.5 mr-1" aria-hidden="true" data-id="element-45"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"></path><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"></circle></svg>
                                                        {cond.category}
                                                    </span>
                                                </template>
                                                <template if:true={cond.hasUnreadComments}>
                                                    <span class="pru-meta-item pru-meta-strong">
                                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-message-square w-3.5 h-3.5 mr-1 text-slate-400" aria-hidden="true" data-id="element-47"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                                                        {cond.commentsLabel}
                                                    </span>
                                                </template>
                                                <template if:true={cond.hasDocs}>
                                                    <span class="pru-meta-item pru-meta-strong">
                                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paperclip w-3.5 h-3.5 mr-1 text-slate-400" aria-hidden="true" data-id="element-49"><path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"></path></svg>
                                                        {cond.docsLabel}
                                                    </span>
                                                </template>
                                            </div>
                                        </div>
                                        <button type="button" class="pru-view-btn" data-condition-id={cond.id} data-loan-id={loan.loanId} onclick={handleOpenCondition}>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0b5cab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder-open w-4 h-4 mr-1.5" aria-hidden="true" data-id="element-52"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"></path></svg>
                                            <span>View Documents and Comments</span>
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
            </template>

            <template if:true={showEmptyState}>
                <div class="pru-empty">
                    <lightning-icon icon-name="utility:check" size="large" class="pru-empty-icon"></lightning-icon>
                    <h3 class="pru-empty-title">Nothing to review</h3>
                    <p class="pru-empty-sub">You're all caught up. New conditions will appear here when borrowers respond.</p>
                </div>
            </template>
        </main>

        <!-- Review Modal -->
        <template if:true={isModalOpen}>
            <div class="pru-modal-backdrop" onclick={handleCloseModal} role="dialog" aria-modal="true">
                <div class="pru-modal" onclick={stopPropagation}>
                    <!-- Modal Header -->
                    <div class="pru-modal-header">
                        <div class="pru-modal-header-left">
                            <div class="pru-modal-title-row">
                                <h2 class="pru-modal-title">{activeCondition.title}</h2>
                                <span class={activeCondition.statusBadgeClass}>
                                    <template if:true={activeCondition.isReviewIcon}>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#92400e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye w-3.5 h-3.5 mr-1" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                    </template>
                                    <template if:false={activeCondition.isReviewIcon}>
                                        <lightning-icon icon-name={activeCondition.statusBadgeIcon} size="xx-small"></lightning-icon>
                                    </template>
                                    {activeCondition.status}
                                </span>
                            </div>
                            <div class="pru-condition-meta pru-mt-sm">
                                <template if:true={activeCondition.category}>
                                    <span class="pru-meta-item">
                                        <lightning-icon icon-name="utility:tag" size="xx-small" class="pru-icon-slate"></lightning-icon>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-tag w-3.5 h-3.5 mr-1" aria-hidden="true" data-id="element-45"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"></path><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"></circle></svg>
                                        {activeCondition.category}
                                    </span>
                                </template>
                                <span class="pru-meta-item">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paperclip w-3.5 h-3.5 mr-1 text-slate-400" aria-hidden="true" data-id="element-49"><path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"></path></svg>
                                    {conditionDocCountLabel}
                                </span>
                                <span class="pru-meta-item">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-message-square w-3.5 h-3.5 mr-1 text-slate-400" aria-hidden="true" data-id="element-67"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                                    {conditionCommentCountLabel}
                                </span>
                            </div>
                        </div>
                        <button type="button" class="pru-icon-btn" onclick={handleCloseModal} aria-label="Close">
                            <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                        </button>
                    </div>

                    <!-- Body -->
                    <div class="pru-modal-body">
                        <!-- Left: preview -->
                        <div class="pru-preview">
                            <div class="pru-preview-toolbar">
                                <template if:true={hasActiveDocSelected}>
                                    <span class="pru-preview-label">Previewing:&nbsp;<span class="pru-preview-name">{activeDocumentLabel}</span></span>
                                    <button type="button" class="pru-preview-download" onclick={handleDownloadActiveDoc}>
                                        <lightning-icon icon-name="utility:download" size="xx-small"></lightning-icon>
                                        Download
                                    </button>
                                </template>
                                <template if:false={hasActiveDocSelected}>
                                    <span class="pru-preview-label">No document selected</span>
                                </template>
                            </div>
                            <div class="pru-preview-stage">
                                <template if:true={hasActiveDocSelected}>
                                    <div class="pru-preview-frame-wrap">
                                        <template if:true={activeDocumentIsImage}>
                                            <div class="pru-preview-image-wrap">
                                                <img
                                                    class="pru-preview-image"
                                                    src={activeDocumentPreviewUrl}
                                                    alt={activeDocumentPreviewTitle}
                                                />
                                            </div>
                                        </template>
                                        <template if:false={activeDocumentIsImage}>
                                            <iframe
                                                class="pru-preview-frame"
                                                src={activeDocumentPreviewUrl}
                                                title={activeDocumentPreviewTitle}
                                            ></iframe>
                                        </template>
                                        <div class="pru-preview-frame-footer">
                                            <p class="pru-preview-card-name">{activeDocumentLabel}</p>
                                            <p class="pru-preview-card-meta">{activeDocumentMetaLabel}</p>
                                        </div>
                                    </div>
                                </template>
                                <template if:false={hasActiveDocSelected}>
                                    <div class="pru-preview-empty">
                                        <lightning-icon icon-name="utility:attach" size="medium"></lightning-icon>
                                        <p>No documents on this condition</p>
                                        <p class="pru-preview-empty-sub">The borrower hasn't uploaded any files yet.</p>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Right: actions -->
                        <aside class="pru-actions">
                            <template if:true={isResolvedApproved}>
                                <div class="pru-banner pru-banner-approved">
                                    <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                                    <span>Condition approved</span>
                                </div>
                            </template>
                            <template if:true={isResolvedRejected}>
                                <div class="pru-banner pru-banner-rejected">
                                    <lightning-icon icon-name="utility:warning" size="xx-small"></lightning-icon>
                                    <span>{rejectedBannerText}</span>
                                </div>
                            </template>

                            <!-- Decision controls -->
                            <div class="pru-actions-section">
                                <h3 class="pru-section-heading">Take Action on Selected Document</h3>

                                <template if:true={isRejecting}>
                                    <div class="pru-reject-form">
                                        <label class="pru-checkbox-card">
                                            <input type="checkbox" checked={sendRejectEmail} onchange={handleSendEmailToggle} />
                                            <div>
                                                <p class="pru-checkbox-card-title">Email the borrower</p>
                                                <p class="pru-checkbox-card-sub">{sendEmailHelpText}</p>
                                            </div>
                                        </label>
                                        <div>
                                            <label class="pru-input-label">{reasonRequiredLabel}</label>
                                            <textarea rows="3" class="pru-textarea" value={rejectionReason}
                                                placeholder={reasonPlaceholder} oninput={handleRejectReasonChange}></textarea>
                                            <template if:true={sendRejectEmail}>
                                                <p class="pru-help-text">A reason is required when emailing the borrower.</p>
                                            </template>
                                        </div>
                                        <div>
                                            <label class="pru-input-label">Updated condition description</label>
                                            <textarea rows="3" class="pru-textarea" value={updatedConditionDescription}
                                                placeholder="Update what the borrower sees for this condition..."
                                                oninput={handleConditionDescriptionChange}></textarea>
                                            <p class="pru-help-text">This updates the condition description shown to the borrower.</p>
                                        </div>
                                        <p class="pru-help-text">{rejectingHelpText}</p>
                                        <div class="pru-button-grid">
                                            <button type="button" class="pru-btn pru-btn-secondary" onclick={handleCancelReject}>Cancel</button>
                                            <button type="button" class="pru-btn pru-btn-danger" onclick={handleConfirmReject} disabled={rejectConfirmDisabled}>
                                                <lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon>
                                                Confirm Reject
                                            </button>
                                        </div>
                                    </div>
                                </template>

                                <template if:false={isRejecting}>
                                    <template if:true={isResolved}>
                                        <button type="button" class="pru-btn pru-btn-secondary pru-btn-block" onclick={handleReopen}>
                                            <lightning-icon icon-name="utility:refresh" size="xx-small"></lightning-icon>
                                            Reopen Condition
                                        </button>
                                    </template>
                                    <template if:false={isResolved}>
                                        <template if:true={hasActiveDocuments}>
                                            <div class="pru-button-grid">
                                                <button type="button" class="pru-btn pru-btn-primary" onclick={handleApprove}>
                                                    <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                                                    Accept Document
                                                </button>
                                                <button type="button" class="pru-btn pru-btn-outline-danger" onclick={handleStartReject}>
                                                    <lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon>
                                                    Reject Document
                                                </button>
                                            </div>
                                        </template>
                                        <template if:false={hasActiveDocuments}>
                                            <p class="pru-help-text">No documents attached. Clear the comment alert to remove it from your queue without changing the condition status.</p>
                                            <button type="button" class="pru-btn pru-btn-primary pru-btn-block" onclick={handleClearCommentAlert}>
                                                <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                                                Clear Comment Alert
                                            </button>
                                        </template>
                                    </template>
                                </template>
                            </div>

                            <!-- Documents -->
                            <div class="pru-actions-section">
                                <div class="pru-section-heading-row">
                                    <h3 class="pru-section-heading">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paperclip w-3.5 h-3.5 mr-1 text-slate-400" aria-hidden="true" data-id="element-49"><path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"></path></svg>
                                        Documents ({activeDocuments.length})
                                    </h3>
                                    <template if:true={isRejecting}>
                                        <span class="pru-section-hint">Rejecting selected document</span>
                                    </template>
                                </div>
                                <template if:true={hasActiveDocuments}>
                                    <ul class="pru-doc-list">
                                        <template for:each={activeDocumentsWithFlags} for:item="doc">
                                            <li key={doc.id} class="pru-doc-li">
                                                <div class={doc.rowClass} data-doc-id={doc.id} onclick={handleSelectDoc}>
                                                    <template if:true={doc.showCheckbox}>
                                                        <input type="checkbox" checked={doc.isMarked}
                                                            data-doc-id={doc.id} onchange={handleToggleDocSelected}
                                                            onclick={stopPropagation}
                                                            class="pru-doc-checkbox" />
                                                    </template>
                                                    <lightning-icon icon-name={doc.iconName} size="small" class={doc.iconClass}></lightning-icon>
                                                    <div class="pru-doc-meta">
                                                        <p class="pru-doc-filename">{doc.filename}</p>
                                                        <p class="pru-doc-sub">{doc.subLabel}</p>
                                                    </div>
                                                    <template if:true={doc.showLinkButton}>
                                                        <button type="button" class="pru-doc-link-btn" data-doc-id={doc.id}
                                                            onclick={handleOpenLinkPopover} title="Move document to another condition">
                                                            <lightning-icon icon-name="utility:link" size="xx-small"></lightning-icon>
                                                        </button>
                                                    </template>
                                                    <template if:true={doc.showReviewButtons}>
                                                        <div class="pru-doc-review-actions">
                                                            <button type="button" class="pru-doc-action-btn pru-doc-action-accept"
                                                                data-doc-id={doc.id} onclick={handleApproveDocumentClick}
                                                                title="Accept this document">
                                                                Accept
                                                            </button>
                                                            <button type="button" class="pru-doc-action-btn pru-doc-action-reject"
                                                                data-doc-id={doc.id} onclick={handleStartReject}
                                                                title="Reject this document">
                                                                Reject
                                                            </button>
                                                        </div>
                                                    </template>
                                                </div>
                                                <template if:true={doc.showPopover}>
                                                    <div class="pru-popover" onclick={stopPropagation}>
                                                        <div class="pru-popover-header">
                                                            <p class="pru-popover-title">Move document to...</p>
                                                            <p class="pru-popover-sub">{doc.filename}</p>
                                                        </div>
                                                        <ul class="pru-popover-list">
                                                            <template for:each={siblingConditions} for:item="sib">
                                                                <li key={sib.id}>
                                                                    <button type="button" class="pru-popover-item" data-target-id={sib.id} onclick={handleAssociate}>
                                                                        <lightning-icon icon-name="utility:link" size="xx-small" class="pru-icon-slate"></lightning-icon>
                                                                        <div class="pru-popover-item-text">
                                                                            <p class="pru-popover-item-title">{sib.title}</p>
                                                                            <div class="pru-popover-item-meta">
                                                                                <span class={sib.statusDotClass}></span>
                                                                                <span>{sib.category}&nbsp;&bull;&nbsp;{sib.status}</span>
                                                                            </div>
                                                                        </div>
                                                                    </button>
                                                                </li>
                                                            </template>
                                                        </ul>
                                                    </div>
                                                </template>
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                                <template if:false={hasActiveDocuments}>
                                    <div class="pru-doc-empty">No documents uploaded yet.</div>
                                </template>
                            </div>

                            <!-- Comments -->
                            <div class="pru-actions-section pru-actions-section-last">
                                <div class="pru-section-heading-row">
                                    <h3 class="pru-section-heading">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-message-square w-3.5 h-3.5 mr-1 text-slate-400" aria-hidden="true" data-id="element-67"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                                        Conversation ({activeComments.length})
                                    </h3>
                                    <template if:true={hasUnreadActiveComments}>
                                        <button type="button" class="pru-clear-comment-alert" onclick={handleClearCommentAlert}>
                                            Clear Alert
                                        </button>
                                    </template>
                                </div>
                                <div class="pru-comments-panel">
                                    <div class="pru-comments-thread">
                                        <template if:true={activeComments.length}>
                                            <template for:each={activeComments} for:item="cm">
                                                <div key={cm.id} class="pru-comment-row">
                                                    <div class="pru-avatar">
                                                        <lightning-icon icon-name="utility:user" size="x-small"></lightning-icon>
                                                        <template if:true={cm.unread}>
                                                            <span class="pru-unread-dot"></span>
                                                        </template>
                                                    </div>
                                                    <div class="pru-comment-body">
                                                        <div class="pru-comment-head">
                                                            <span class="pru-comment-author">{cm.authorName}
                                                                <span class="pru-comment-role">({cm.role})</span>
                                                                <template if:true={cm.unread}>
                                                                    <span class="pru-new-chip">New</span>
                                                                </template>
                                                            </span>
                                                            <span class="pru-comment-ts">{cm.timestampLabel}</span>
                                                        </div>
                                                        <div class={cm.bubbleClass}>
                                                            <template if:true={cm.isPrivate}>
                                                                <div class="pru-internal-only">
                                                                    <lightning-icon icon-name="utility:lock" size="xx-small"></lightning-icon>
                                                                    Internal Only
                                                                </div>
                                                            </template>
                                                            <p class="pru-comment-text">{cm.message}</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                        </template>
                                        <template if:false={activeComments.length}>
                                            <p class="pru-comments-empty">No comments yet.</p>
                                        </template>
                                    </div>

                                    <div class="pru-reply">
                                        <div class="pru-vis-toggle">
                                            <button type="button" class={publicTabClass} onclick={handleVisibilityPublic}>
                                                <lightning-icon icon-name="utility:world" size="xx-small"></lightning-icon>
                                                Public
                                            </button>
                                            <button type="button" class={privateTabClass} onclick={handleVisibilityPrivate}>
                                                <lightning-icon icon-name="utility:lock" size="xx-small"></lightning-icon>
                                                Private
                                            </button>
                                        </div>
                                        <p class="pru-vis-help">{visibilityHelpHtml}</p>
                                        <div class="pru-reply-input-wrap">
                                            <textarea rows="2" class={textareaClass} value={replyText}
                                                placeholder="Type a reply..." oninput={handleReplyChange}></textarea>
                                            <button type="button" class={sendBtnClass} onclick={handleSendReply} disabled={sendDisabled}>
                                                <lightning-icon icon-name="utility:send" size="xx-small"></lightning-icon>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </aside>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
