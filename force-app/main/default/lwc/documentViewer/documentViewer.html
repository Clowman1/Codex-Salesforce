<template>
	<lightning-card variant="narrow" icon-name="standard:file" class="slds-p-horizontal_x-small">
		<h3 slot="title">Loan Documents</h3>

		<div class="slds-grid slds-gutters_direct slds-gutters_direct-xx-small" slot="actions">
			<div class="slds-grid slds-gutters slds-gutters_xx-small slds-col slds-col_bump-left">
				<lightning-input
					type="text"
					variant="label-hidden"
					class="slds-col"
					value={filter}
					onchange={handleFilterChange}
				></lightning-input>
				<lightning-button
					variant="brand"
					class="slds-col"
					label="Search"
					onclick={handleFilterFiles}
				></lightning-button>
			</div>

			<lightning-button-icon
				icon-name="utility:download"
				alternative-text="Download All"
				title="Download All"
				class="slds-col"
				onclick={downloadAllFiles}
				variant="inverse"
			></lightning-button-icon>

			<lightning-button-icon
				icon-name="utility:refresh"
				alternative-text="Refresh"
				title="Refresh"
				class="slds-col"
				onclick={connectedCallback}
				variant="inverse"
			></lightning-button-icon>
		</div>

		<div slot="footer">
			<div>Total folders: {allFolders.length}</div>
			<div>Total documents: {docs.length}</div>
		</div>

		<lightning-accordion allow-multiple-sections-open active-section-name={activeFolders}>
			<template for:each={folders} for:item="folder" for:index="folderIndex">
				<lightning-accordion-section name={folder.name} label={folder.name} key={folder.name}>
					<lightning-button-menu slot="actions" alternative-text="Show menu" icon-size="x-small"
										   menu-alignment="auto" class="slds-m-right_large">
						<lightning-menu-item value="Rename" label="Rename Folder" onclick={openRenameFolderModal}
											 data-index={folderIndex}></lightning-menu-item>
						<lightning-menu-item value="Download" label="Download Folder" onclick={downloadFolder}
											 data-index={folderIndex}></lightning-menu-item>
					</lightning-button-menu>

					<lightning-datatable
						key={folder}
						key-field="id"
						data={folder.data}
						columns={fileTableColumns}
						onrowaction={handleRowAction}
						resize-column-disabled
						hide-checkbox-column
					></lightning-datatable>
				</lightning-accordion-section>
			</template>
		</lightning-accordion>
	</lightning-card>

	<template if:true={renameFolderModalOpen}>
		<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
				 aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
							title="Close" onclick={closeRenameFolderModal}>
						<lightning-icon icon-name="utility:close"
										alternative-text="close"
										variant="inverse"
										size="small"
						></lightning-icon>
						<span class="slds-assistive-text">Close</span>
					</button>
					<h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Rename Folder</h2>
				</header>

				<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
					<lightning-input type="text"
									 label={renameFolderLabel}
									 value={folderToRename.newName}
									 onchange={validateNewFolderName}
									 pattern="[\s\dA-Za-z]+"
									 required
					></lightning-input>
				</div>

				<footer class="slds-modal__footer">
					<button class="slds-button slds-button_neutral" onclick={closeRenameFolderModal} title="Cancel">
						Cancel
					</button>
					<button class="slds-button slds-button_brand" onclick={handleFolderRename}
							disabled={isNewFolderNameInvalid} title="Rename">Rename
					</button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>

	<template if:true={deleteModalOpen}>
		<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-02" aria-modal="true"
				 aria-describedby="modal-content-id-2" class="slds-modal slds-fade-in-open">
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
							title="Close" onclick={closeDeleteModal}>
						<lightning-icon icon-name="utility:close"
										alternative-text="close"
										variant="inverse"
										size="small"
						></lightning-icon>
						<span class="slds-assistive-text">Close</span>
					</button>
					<h2 id="modal-heading-02" class="slds-text-heading_medium slds-hyphenate">Delete Document</h2>
				</header>

				<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
					<p>Are you sure you want to delete file "{fileToDelete.fileName}.{fileToDelete.fileType}"?</p>
				</div>

				<footer class="slds-modal__footer">
					<button class="slds-button slds-button_neutral" onclick={closeDeleteModal} title="Cancel">Cancel
					</button>
					<button class="slds-button slds-button_brand" onclick={handleFileDelete} title="Delete">Delete
					</button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>

	<template if:true={changeFolderModalOpen}>
		<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-03" aria-modal="true"
				 aria-describedby="modal-content-id-3" class="slds-modal slds-fade-in-open">
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
							title="Close" onclick={closeChangeFolderModal}>
						<lightning-icon icon-name="utility:close"
										alternative-text="close"
										variant="inverse"
										size="small"
						></lightning-icon>
						<span class="slds-assistive-text">Close</span>
					</button>
					<h2 id="modal-heading-03" class="slds-text-heading_medium slds-hyphenate">
						Change folder for "{fileToChangeFolder.fileName}.{fileToChangeFolder.fileType}"
					</h2>
				</header>

				<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-3">
					<lightning-combobox
						name="progress"
						label="Select new folder"
						value={selectedDefaultFolder}
						placeholder="Select Folder"
						options={changeFolderOptions}
						onchange={handleNewFolderSelect}
						required
					></lightning-combobox>
				</div>

				<footer class="slds-modal__footer">
					<button class="slds-button slds-button_neutral"
							onclick={closeChangeFolderModal}
							title="Cancel"
					>
						Cancel
					</button>
					<button class="slds-button slds-button_brand"
							onclick={handleFolderChange}
							disabled={isNewFolderForFileInvalid}
							title="Delete"
					>
						Change Folder
					</button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>

	<template if:true={renameFileModalOpen}>
		<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-04" aria-modal="true"
				 aria-describedby="modal-content-id-4" class="slds-modal slds-fade-in-open">
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
							title="Close" onclick={closeRenameFileModal}>
						<lightning-icon icon-name="utility:close"
										alternative-text="close"
										variant="inverse"
										size="small"
						></lightning-icon>
						<span class="slds-assistive-text">Close</span>
					</button>
					<h2 id="modal-heading-04" class="slds-text-heading_medium slds-hyphenate">
						Rename "{fileToRename.fileName}.{fileToRename.fileType}"
					</h2>
				</header>

				<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-4">
					<lightning-input
						type="text"
						label="Enter new file name"
						value={fileToRename.fileName}
						onchange={validateNewFileName}
						required
					></lightning-input>
				</div>

				<footer class="slds-modal__footer">
					<button class="slds-button slds-button_neutral"
							onclick={closeRenameFileModal}
							title="Cancel"
					>
						Cancel
					</button>
					<button class="slds-button slds-button_brand"
							onclick={handleFileRename}
							disabled={isNewFileNameInvalid}
							title="Delete"
					>
						Rename
					</button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>

	<template if:true={relateConditionModalOpen}>
		<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-04" aria-modal="true"
				 aria-describedby="modal-content-id-5" class="slds-modal slds-fade-in-open">
			<div class="slds-modal__container">
				<header class="slds-modal__header">
					<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
							title="Close" onclick={closeConditionPickModal}>
						<lightning-icon icon-name="utility:close"
										alternative-text="close"
										variant="inverse"
										size="small"
						></lightning-icon>
						<span class="slds-assistive-text">Close</span>
					</button>
					<h2 id="modal-heading-05" class="slds-text-heading_medium slds-hyphenate">
						Pick Condition for "{fileToRelate.fileName}.{fileToRelate.fileType}"
					</h2>
				</header>

				<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-5">
					<lightning-combobox
						name="conditionsPicker"
						label="Select condition to relate"
						options={conditionOptions}
						onchange={handleNewConditionPick}
						required
					></lightning-combobox>
				</div>

				<footer class="slds-modal__footer">
					<button class="slds-button slds-button_neutral"
							onclick={closeConditionPickModal}
							title="Cancel"
					>
						Cancel
					</button>
					<button class="slds-button slds-button_brand"
							onclick={handleConditionRelate}
							title="Relate"
							disabled={relateConditionDisabled}
					>
						Relate
					</button>
				</footer>
			</div>
		</section>
		<div class="slds-backdrop slds-backdrop_open"></div>
	</template>

	<template if:true={isLoading}>
		<lightning-spinner alternative-text="Loading..." variant="brand">
		</lightning-spinner>
	</template>
</template>
